<!doctype html>
<meta charset="utf-8" />
<title>Exam Question Scraper</title>
<style>
  :root { color-scheme: light dark; }
  body {
    width: 360px;
    margin: 0;
    padding: 12px;
    font: 13px/1.45 system-ui, -apple-system, Segoe UI, sans-serif;
  }
  h1 { font-size: 14px; margin: 0 0 8px; }
  button {
    font: inherit;
    font-size: 12px;
    padding: 4px 9px;
    border-radius: 6px;
    border: 1px solid #8886;
    background: #0d6efd;
    color: #fff;
    cursor: pointer;
  }
  button.secondary { background: transparent; color: inherit; }
  button.danger { background: transparent; color: #d33; border-color: #d336; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  #status { margin: 8px 0; min-height: 16px; font-size: 12px; }
  #status.err { color: #d33; }
  .muted { opacity: .7; }
  .exam {
    border: 1px solid #8884;
    border-radius: 8px;
    padding: 8px;
    margin-bottom: 8px;
  }
  .exam.current { border-color: #0d6efd; }
  .exam h2 {
    font-size: 12px;
    margin: 0 0 2px;
    word-break: break-word;
  }
  .meta { font-size: 11px; margin-bottom: 6px; }
  .empty { font-size: 12px; }
</style>

<h1>Exam Question Scraper</h1>
<div class="row">
  <button id="scrape" class="secondary">Scrape this page now</button>
  <button id="refresh" class="secondary">Refresh</button>
</div>
<div id="status" class="muted"></div>
<div id="exams"></div>
<script src="images.js"></script>
<script src="pdf.js"></script>
<script src="popup.js"></script>
